<style>

<script>
const cv=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.outputEncoding=THREE.sRGBEncoding;R.shadowMap.enabled=true;
const S=new THREE.Scene();S.background=new THREE.Color(0x5db4ff);S.fog=new THREE.Fog(0xa8d8ff,60,170);
const cam=new THREE.PerspectiveCamera(75,1,.1,300);cam.rotation.order='YXZ';S.add(cam);
S.add(new THREE.HemisphereLight(0xdff0ff,0xb08860,.95));
const sun=new THREE.DirectionalLight(0xfff0d0,.9);sun.position.set(-40,38,-48);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-55,right:55,top:55,bottom:-55,far:140});S.add(sun);

// ---- céu: cúpula em degradê + sol + nuvens ----
const SKY=(function(){
 const sd0=new THREE.Vector3().copy(sun.position).normalize();
 const dome=new THREE.Mesh(new THREE.SphereGeometry(250,32,16),new THREE.ShaderMaterial({
  side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{hor:{value:new THREE.Color(0xa8d8ff)},mid:{value:new THREE.Color(0x6cb8ff)},top:{value:new THREE.Color(0x2f78d8)},sunD:{value:sd0},sunC:{value:new THREE.Color(0xfff0c0)}},
  vertexShader:'varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:'uniform vec3 hor,mid,top,sunC,sunD;varying vec3 vP;void main(){vec3 d=normalize(vP);float h=clamp(d.y,0.0,1.0);'
   +'vec3 c=mix(hor,mid,smoothstep(0.0,0.22,h));c=mix(c,top,smoothstep(0.18,0.85,h));'
   +'float s=max(dot(d,sunD),0.0);c+=sunC*(pow(s,6.0)*0.18+pow(s,40.0)*0.35);'
   +'gl_FragColor=vec4(c,1.0);\n#include <encodings_fragment>\n}'
 }));
 dome.renderOrder=-10;dome.frustumCulled=false;S.add(dome);

 // sol (disco + brilho)
 const sc=document.createElement('canvas');sc.width=sc.height=256;{const x=sc.getContext('2d'),g=x.createRadialGradient(128,128,0,128,128,128);
  g.addColorStop(0,'rgba(255,255,245,1)');g.addColorStop(.1,'rgba(255,250,215,1)');g.addColorStop(.13,'rgba(255,235,160,.55)');g.addColorStop(.35,'rgba(255,215,120,.18)');g.addColorStop(1,'rgba(255,200,100,0)');x.fillStyle=g;x.fillRect(0,0,256,256)}
 const sunSp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(sc),blending:THREE.AdditiveBlending,transparent:true,depthWrite:false,fog:false}));
 sunSp.scale.set(120,120,1);sunSp.renderOrder=-5;S.add(sunSp);

 // nuvens: 4 texturas de aglomerados, sprites espalhados em anel
 let q=20261102;const r=()=>(q=(q*16807)%2147483647)/2147483647;
 const texs=[];
 for(let v=0;v<4;v++){const c=document.createElement('canvas');c.width=512;c.height=256;const x=c.getContext('2d');
  const blobs=[];const n=9+Math.floor(r()*5);
  for(let i=0;i<n;i++){const t=i/(n-1),bx=70+t*372+(r()-.5)*30,hump=Math.sin(t*Math.PI),rad=34+hump*34+r()*22,by=170-hump*34*r()-rad*.25;blobs.push([bx,by,rad])}
  const draw=(dy,c0,c1)=>{for(const[bx,by,rad]of blobs){const g=x.createRadialGradient(bx,by+dy,rad*.1,bx,by+dy,rad);g.addColorStop(0,c0);g.addColorStop(.65,c0);g.addColorStop(1,c1);x.fillStyle=g;x.beginPath();x.arc(bx,by+dy,rad,0,7);x.fill()}};
  draw(14,'rgba(176,198,230,.95)','rgba(176,198,230,0)');
  draw(0,'rgba(255,255,255,.97)','rgba(255,255,255,0)');
  texs.push(new THREE.CanvasTexture(c))}
 const cl=new THREE.Group();S.add(cl);
 for(let i=0;i<26;i++){const a=i/26*Math.PI*2+r()*.2,el=(7+Math.pow(r(),1.4)*46)*Math.PI/180,D=215;
  const m=new THREE.Sprite(new THREE.SpriteMaterial({map:texs[i%4],transparent:true,depthWrite:false,fog:false,opacity:.9}));
  m.position.set(Math.cos(a)*Math.cos(el)*D,Math.sin(el)*D,Math.sin(a)*Math.cos(el)*D);
  const w=110+r()*110;m.scale.set(w,w*.5,1);m.renderOrder=-4;cl.add(m)}
 return{dome,sunSp,cl,sd:sd0,update(dt){const p=cam.position;dome.position.copy(p);cl.position.copy(p);cl.rotation.y+=dt*.004;sunSp.position.copy(p).addScaledVector(sd0,235)}};
})();

let sd=5;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
function ctex(w,h,f,rep){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,rep)}return t}
// paredes com grafite
const WORDS=['VNX','NEON','CREW','ZAP','KING','RUSH'],PAIR=[['#40d8ff','#2a6cff'],['#ff4fd8','#a020f0'],['#ffd23a','#ff7a1a'],['#7dff5a','#1fa84a'],['#ff7a7a','#d81f5a'],['#ffffff','#8ec0ff']];
const WC=['#e8a33a','#4a7fe0','#a85ad8','#e0609c','#3fbfa8','#e8c94a'];
function noise(x,w,h,n,a){for(let i=0;i<n;i++){x.fillStyle=`rgba(${rnd()>.5?'0,0,0':'255,255,255'},${rnd()*a})`;const s=1+rnd()*3;x.fillRect(rnd()*w,rnd()*h,s,s)}}
function bubble(x,t,cx,cy,sz,c1,c2,rot=-.05){
 x.save();x.translate(cx,cy);x.rotate(rot);x.font=`900 ${sz}px Impact,'Arial Black',sans-serif`;x.textAlign='center';x.textBaseline='middle';x.lineJoin='round';x.lineCap='round';
 x.fillStyle='rgba(0,0,0,.35)';x.fillText(t,sz*.07,sz*.08);
 x.lineWidth=sz*.22;x.strokeStyle='#120c24';x.strokeText(t,0,0);
 x.lineWidth=sz*.09;x.strokeStyle='#fff';x.strokeText(t,0,0);
 const g=x.createLinearGradient(0,-sz/2,0,sz/2);g.addColorStop(0,c1);g.addColorStop(1,c2);
 x.fillStyle=g;x.shadowColor=c1;x.shadowBlur=sz*.04;x.fillText(t,0,0);x.shadowBlur=0;
 x.save();x.beginPath();x.rect(-600,-sz*.46,1200,sz*.13);x.clip();x.fillStyle='rgba(255,255,255,.4)';x.fillText(t,0,0);x.restore();
 const wd=x.measureText(t).width;x.strokeStyle=c2;
 for(let i=0;i<4;i++){const dx=-wd/2+wd*(.1+.8*rnd()),len=18+rnd()*45;x.lineWidth=5+rnd()*4;x.beginPath();x.moveTo(dx,sz*.38);x.lineTo(dx,sz*.38+len);x.stroke();x.fillStyle=c2;x.beginPath();x.arc(dx,sz*.38+len+2,x.lineWidth*.7,0,7);x.fill()}
 x.restore()}
function crown(x,cx,cy,s,c1,c2){x.save();x.translate(cx,cy);x.scale(s,s);x.lineJoin='round';
 x.beginPath();x.moveTo(-50,30);x.lineTo(-58,-30);x.lineTo(-22,0);x.lineTo(0,-42);x.lineTo(22,0);x.lineTo(58,-30);x.lineTo(50,30);x.closePath();
 x.lineWidth=14;x.strokeStyle='#120c24';x.stroke();const g=x.createLinearGradient(0,-40,0,30);g.addColorStop(0,c1);g.addColorStop(1,c2);x.fillStyle=g;x.fill();
 x.lineWidth=4;x.strokeStyle='#fff';x.stroke();[[-58,-30],[0,-42],[58,-30]].forEach(p=>{x.beginPath();x.arc(p[0],p[1],8,0,7);x.fillStyle='#fff';x.fill()});x.restore()}
function smiley(x,cx,cy,r,c1,c2){x.save();x.translate(cx,cy);x.lineCap='round';
 x.lineWidth=r*.16;x.strokeStyle='#120c24';x.beginPath();x.arc(0,0,r,0,7);x.stroke();
 const g=x.createRadialGradient(-r*.3,-r*.3,r*.1,0,0,r);g.addColorStop(0,c1);g.addColorStop(1,c2);x.fillStyle=g;x.fill();
 x.strokeStyle='#120c24';x.lineWidth=r*.12;[-1,1].forEach(s=>{x.beginPath();x.moveTo(s*r*.5-r*.17,-r*.4-r*.17);x.lineTo(s*r*.5+r*.17,-r*.4+r*.17);x.moveTo(s*r*.5+r*.17,-r*.4-r*.17);x.lineTo(s*r*.5-r*.17,-r*.4+r*.17);x.stroke()});
 x.beginPath();x.arc(0,r*.1,r*.55,.2,Math.PI-.2);x.stroke();
 x.strokeStyle=c2;x.lineWidth=7;[-.5,.1,.6].forEach(k=>{x.beginPath();x.moveTo(k*r,r*.95);x.lineTo(k*r,r*1.25+rnd()*30);x.stroke()});x.restore()}

const NEON=['#40d8ff','#ff4fd8','#ffd23a','#7dff5a'];
function bricks(x,y0,y1,w){x.fillStyle='#8f5642';x.fillRect(0,y0,w,y1-y0);x.strokeStyle='#4a2a20';x.lineWidth=3;
 for(let r=0,y=y0;y<y1;y+=22,r++){x.beginPath();x.moveTo(0,y);x.lineTo(w,y);x.stroke();for(let bx=(r%2)*30;bx<w;bx+=60){x.beginPath();x.moveTo(bx,y);x.lineTo(bx,y+22);x.stroke()}}
 for(let i=0;i<80;i++){x.fillStyle=`rgba(${rnd()>.5?'60,20,10':'200,120,90'},.18)`;x.fillRect(rnd()*w,y0+rnd()*(y1-y0),30,18)}}
function windowAt(x,wx,wy){x.fillStyle='rgba(0,0,0,.3)';x.fillRect(wx+5,wy+5,84,104);x.fillStyle='#e4e2dc';x.fillRect(wx-6,wy-6,96,116);
 const g=x.createLinearGradient(wx,wy,wx+84,wy+104);g.addColorStop(0,'#5b7fb0');g.addColorStop(.5,'#1d2c48');g.addColorStop(1,'#34517c');x.fillStyle=g;x.fillRect(wx,wy,84,104);
 x.fillStyle='#e4e2dc';x.fillRect(wx+39,wy,6,104);x.fillRect(wx,wy+48,84,6);x.fillStyle='#b5b2aa';x.fillRect(wx-10,wy+110,104,10)}
const base=[];
WC.forEach((col,ci)=>{for(let v=0;v<3;v++)base.push(ctex(512,512,(x,w,h)=>{
